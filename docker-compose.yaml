services:
 
  # ── PostgreSQL + pgvector ──────────────────────────────────────────────────
  db:
    image: pgvector/pgvector:pg15
    container_name: maitri_db_container
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER:     ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB:       ${DATABASE_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME} -d ${DATABASE_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
 
  # ── FastAPI backend ────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: maitri_backend_container
    restart: always
    env_file:
      - .env
    environment:
      # ── Database (hostname must be the compose service name, not localhost) ──
      DATABASE_HOSTNAME:  db
      DATABASE_PORT:      "5432"
      DATABASE_USERNAME:  ${DATABASE_USERNAME}
      DATABASE_PASSWORD:  ${DATABASE_PASSWORD}
      DATABASE_NAME:      ${DATABASE_NAME}
      # ── JWT ──────────────────────────────────────────────────────────────────
      SECRET_KEY:                   ${SECRET_KEY}
      ALGORITHM:                    ${ALGORITHM}
      ACCESS_TOKEN_EXPIRE_MINUTES:  ${ACCESS_TOKEN_EXPIRE_MINUTES}
      # ── AI APIs ──────────────────────────────────────────────────────────────
      GROQ_API_KEY:   ${GROQ_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      # ── Model / RAG ──────────────────────────────────────────────────────────
      GROQ_MODEL:                 ${GROQ_MODEL}
      EMBED_DIM:                  ${EMBED_DIM}
      CHUNK_SIZE:                 ${CHUNK_SIZE}
      CHUNK_OVERLAP:              ${CHUNK_OVERLAP}
      RAG_TOP_K:                  ${RAG_TOP_K}
      CONVERSATION_HISTORY_LIMIT: ${CONVERSATION_HISTORY_LIMIT}
      NUMBA_CACHE_DIR: /tmp/numba_cache 
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
 
  # ── React + Vite frontend (Nginx) ──────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: maitri_frontend_container
    restart: always
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
 
volumes:
  postgres_data:
